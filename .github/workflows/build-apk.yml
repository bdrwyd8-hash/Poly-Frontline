name: Build Android APK & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Polyfield Frontline APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses & ensure platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Type-check & run gameplay unit tests
        run: |
          npm run lint
          npx tsx --test src/game/rules.test.ts

      - name: Build web bundle & sync Capacitor Android
        run: |
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare downloadable APK file
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Polyfield-Frontline.apk
          ls -lh release/Polyfield-Frontline.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Polyfield-Frontline-APK
          path: release/Polyfield-Frontline.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-apk' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Polyfield Frontline {0}', github.ref_name) || 'Polyfield Frontline — Latest APK' }}
          make_latest: true
          files: |
            release/Polyfield-Frontline.apk
          body: |
            ## Polyfield Frontline — Android APK
            حمل ملف التثبيت المباشر للعبة على أندرويد من المرفقات أدناه (**Polyfield-Frontline.apk**).

            - **Direct APK Download**: Download `Polyfield-Frontline.apk` from **Assets** below and install on Android (Android 7.0+).
            - Built automatically from commit `${{ github.sha }}`.
